<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Milpa">
<meta name="theme-color" content="#2b2118">
<link rel="manifest" href="manifest.webmanifest">
<title>Mi milpa</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--suelo:#2b2118;--tierra:#4a3826;--maiz:#e8b923;--hoja:#7d9b3a;--alerta:#d9532b;--texto:#f4ecd8}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--suelo);color:var(--texto);font-family:"Avenir Next",system-ui,sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{padding:10px 16px;display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:20px;margin:0;font-weight:700}
#sub{font-size:13px;opacity:.75}
#map{flex:1;min-height:0}
.panel{background:var(--tierra);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:grid;gap:10px}
.fila{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:15px;padding:10px 14px;border-radius:10px;border:0;background:var(--suelo);color:var(--texto);min-height:44px}
button.main{background:var(--maiz);color:var(--suelo);font-weight:700}
button:focus-visible{outline:3px solid var(--maiz);outline-offset:2px}
#area{font-size:22px;font-weight:700}
.aviso{border-left:4px solid var(--hoja);padding:6px 10px;font-size:14px;background:rgba(0,0,0,.2);border-radius:0 8px 8px 0}
.aviso.off{border-color:var(--alerta)}
</style></head><body>
<header><h1>Mi milpa</h1><span id="sub">Muñoz de Domingo Arenas, Tlax.</span></header>
<div id="map" role="application" aria-label="Mapa satelital"></div>
<section class="panel">
 <div><span id="area">0.0 ha</span> <span id="ayuda" style="font-size:13px;opacity:.8">Toca las esquinas de tu terreno en el mapa</span></div>
 <div class="fila">
  <button class="main" id="ubicar">Ubicarme</button>
  <button id="deshacer">Deshacer punto</button>
  <button id="borrar">Borrar terreno</button>
 </div>
 <div class="aviso off" id="avisos">Avisos del SMN: sin conexión todavía. Falta el servidor intermedio.</div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const K='milpa:terreno';
const map=L.map('map',{zoomControl:false}).setView([19.32,-98.2],10);
L.control.zoom({position:'topright'}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imágenes © Esri, Maxar, Earthstar Geographics'}).addTo(map);
let pts=[],poly=null,marks=[];
try{pts=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){pts=[]}
function area(p){if(p.length<3)return 0;const R=6378137,d=Math.PI/180;let a=0;for(let i=0;i<p.length;i++){const p1=p[i],p2=p[(i+1)%p.length];a+=(p2[1]-p1[1])*d*(2+Math.sin(p1[0]*d)+Math.sin(p2[0]*d))}return Math.abs(a*R*R/2)}
function dibujar(){
 if(poly)map.removeLayer(poly);marks.forEach(m=>map.removeLayer(m));marks=[];
 pts.forEach(p=>marks.push(L.circleMarker(p,{radius:6,color:'#2b2118',fillColor:'#e8b923',fillOpacity:1,weight:2}).addTo(map)));
 if(pts.length>1)poly=(pts.length>2?L.polygon:L.polyline)(pts,{color:'#e8b923',weight:3,fillOpacity:.15}).addTo(map);
 const ha=area(pts)/10000;
 document.getElementById('area').textContent=ha.toFixed(1)+' ha';
 document.getElementById('ayuda').textContent=pts.length<3?'Toca las esquinas de tu terreno en el mapa':pts.length+' esquinas guardadas';
 try{localStorage.setItem(K,JSON.stringify(pts))}catch(e){}
}
map.on('click',e=>{pts.push([e.latlng.lat,e.latlng.lng]);dibujar()});
document.getElementById('deshacer').onclick=()=>{pts.pop();dibujar()};
document.getElementById('borrar').onclick=()=>{if(pts.length&&confirm('¿Borrar el terreno dibujado?')){pts=[];dibujar()}};
document.getElementById('ubicar').onclick=()=>{
 if(!navigator.geolocation){alert('Tu navegador no permite ubicación.');return}
 navigator.geolocation.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],17),()=>alert('No se pudo obtener tu ubicación. Revisa el permiso de Safari.'),{enableHighAccuracy:true});
};
dibujar();
if(pts.length>2)map.fitBounds(L.polygon(pts).getBounds().pad(.2));
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
